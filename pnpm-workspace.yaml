packages:
  # all packages in direct subdirs of packages/
  - packages/node-opcua-debug
  - packages/node-opcua-binary-stream
  - packages/*
  - packages_extra/node-opcua-example
  - tools/*
  # consumer smoke tests: they must resolve node-opcua the way a real consumer does,
  # which means being real packages with a real dependency on it
  - fixtures/*
  # all packages in subdirs of components/
  # - 'packages_extra/*'

  # pnpm 11 ignores install scripts of native packages by default;
  # this list explicitly allow-lists those we trust to run.
onlyBuiltDependencies:
  - esbuild

# Match cross-workspace dependencies (plain "2.171.0"-style specifiers)
# against local workspace packages instead of the registry. Without this,
# pnpm 11 falls through to npmjs.org and 404s on private/unpublished
# packages like @sterfive/fix-tsconfigs or unpublished version bumps.
# (The same setting was in .npmrc but pnpm 11 doesn't honor it from there.)
linkWorkspacePackages: true

allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.4.16'
  - '@biomejs/cli-darwin-arm64@2.4.16'
  - '@biomejs/cli-darwin-x64@2.4.16'
  - '@biomejs/cli-linux-arm64-musl@2.4.16'
  - '@biomejs/cli-linux-arm64@2.4.16'
  - '@biomejs/cli-linux-x64-musl@2.4.16'
  - '@biomejs/cli-linux-x64@2.4.16'
  - '@biomejs/cli-win32-arm64@2.4.16'
  - '@biomejs/cli-win32-x64@2.4.16'
  - node-opcua-pki@6.18.0 || 6.19.0 || 6.19.1 || 6.20.0 || 6.21.0
  - node-opcua-crypto@5.4.0 || 5.5.0 || 5.9.0
  - '@inquirer/checkbox@5.2.3'
  - '@inquirer/confirm@6.3.0'
  - '@inquirer/core@12.0.1'
  - '@inquirer/editor@5.3.1'
  - '@inquirer/expand@5.1.3'
  - '@inquirer/input@5.1.4'
  - '@inquirer/number@4.2.1'
  - '@inquirer/password@5.2.0'
  - '@inquirer/prompts@8.7.0'
  - '@inquirer/rawlist@5.3.3'
  - '@inquirer/search@4.3.1'
  - '@inquirer/select@5.2.3'
  - '@inquirer/type@4.1.0'

# Override transitive dependencies to fix Dependabot vulnerabilities
overrides:
  js-yaml: ">=4.1.2"
  brace-expansion: ">=5.0.6"
  picomatch: ">=4.0.4"
  esbuild: ">=0.28.1"
