
stages:
    - build

variables:
    # Every job of a pipeline runs as a container on this runner's default docker0
    # bridge, so all of them share one link-local multicast domain. The discovery
    # tests announce their servers over mDNS, and FindServersOnNetwork then returns
    # the servers of whichever sibling job happens to be running its own discovery
    # tests at that moment - DISCO3-2 counted 7 or 8 servers where it expected 6,
    # and the surplus was traced to an LDS advertised from another container
    # (concurrent-2 at 172.17.0.3, while the job itself was concurrent-4).
    #
    # GitHub Actions never sees this because each matrix entry gets its own VM. A
    # network per build gives each job a bridge of its own, which is the same
    # isolation, and is why the identical suite is green there and red here.
    FF_NETWORK_PER_BUILD: "true"

# Cache the pnpm store and nothing else. `packages/` used to be listed here, and that
# is a trap: the cache is restored AFTER the checkout, so the archive - which holds
# tracked source, not just build output - was extracted over the freshly checked-out
# tree and jobs silently ran the previous pipeline's code. A fix to any file under
# packages/ appeared to have no effect. `node_modules/` is a pnpm symlink farm that is
# not portable and that install rebuilds anyway, `.npm/` is npm's cache in a repo that
# installs with pnpm, and `~/.pnpm-store` is outside the project directory, so GitLab
# never cached it - the store actually lives at $CI_PROJECT_DIR/.pnpm-store.
#
# The key is versioned because the poisoned archives are still on the cache server
# under the old key; restoring one would clobber the checkout again no matter what
# this paths list says.
cache:
    key: ${CI_COMMIT_REF_SLUG}-v2
    paths:
        - .pnpm-store/

.build_template: &build_template
    variables:
        KUBERNETES_CPU_REQUEST: 4
        KUBERNETES_CPU_LIMIT: 4
        KUBERNETES_MEMORY_REQUEST: 4Gi
        KUBERNETES_MEMORY_LIMIT: 4Gi
    stage: build
    before_script:
        # Node 26 no longer bundles corepack, so `corepack enable` exits 127 there and the
        # job died before reaching the suite - allow_failure hid it, leaving that runtime
        # untested rather than tested-and-tolerated. Install it only when it is missing;
        # 22 and 24 keep using the bundled one. GitHub never hit this: it provisions pnpm
        # with pnpm/action-setup instead of going through corepack.
        - command -v corepack >/dev/null 2>&1 || npm i -g corepack
        - corepack enable
        - corepack prepare --activate
        - pnpm --version
        - pnpm config set store-dir `pwd`/.pnpm-store
        # --ignore-scripts: skip postinstall so pnpm 11 doesn't error on
        # ERR_PNPM_IGNORED_BUILDS for esbuild. The `pnpm run build` below
        # explicitly runs what postinstall would have done.
        - pnpm recursive install --frozen-lockfile=false --ignore-scripts
    script:
        - pnpm run consistency
        # build:all = generate:types + tsc. Needed because _generated_opcua_types.ts
        # is gitignored; the lean `build` (tsc only) doesn't produce it. Nodeset
        # generation is deliberately NOT part of it: that output is committed.
        - pnpm run build:all
        - pnpm run pretest
        - node ${SECURITY_OPTIONS} packages/parallel_test.js
        # - node packages/run_all_mocha_tests.js DISCO3

