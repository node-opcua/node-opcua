# The conformance checks of documentation/rfc/nodeset-ndjson.md, section 9: every published
# nodeset through records -> NodeSet2 XML -> records, an element census of each source
# document against the regenerated one, and the two ways back to XML compared. Kept out of
# `pnpm test` because they run over the whole catalogue and take minutes; kept in CI because
# what they protect, that the format carries the document, is invisible to any smaller test.
nodeset_roundtrip:
  <<: *build_template
  image: node:24
  script:
    - pnpm run build:all
    - pnpm --filter node-opcua-address-space run test:long

build_and_test_node_22:
  <<: *build_template
  image: node:22

build_and_test_node_24:
  <<: *build_template
  image: node:24

# Node 26 is the current release line. It is allowed to fail for now: it runs so
# the next LTS promotion is not the first time we hear about a breakage, but a red
# result on the newest runtime must not block a merge.
build_and_test_node_26:
  <<: *build_template
  image: node:26
  allow_failure: true


